[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdbflow"
version = "0.1.0"
description = "PySpark pipeline for parsing legacy PDB structure files at scale"
requires-python = ">=3.10"

[project.scripts]
pdbflow = "pdbflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]